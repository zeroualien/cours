<!-- Correctif autonome Dark Mode + Responsive Mobile KaTeX -->
<script>
(function () {
    let t = 'light';
    try { t = localStorage.getItem('theme') || ''; } catch (e) {}
    if (t !== 'dark' && t !== 'light') {
        t = window.name === 'theme:dark' ? 'dark'
          : window.name === 'theme:light' ? 'light'
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    }
    document.documentElement.setAttribute('data-theme', t);
    document.documentElement.style.colorScheme = t;
})();
</script>
<style>
:root[data-theme="light"] {
    --bg: #F5F5F7; --text: #1D1D1F; --muted: #515154; --quote: rgba(0,0,0,0.035); --border: rgba(0,0,0,0.12);
}
:root[data-theme="dark"] {
    --bg: #161618; --text: #F5F5F7; --muted: #A1A1A6; --quote: rgba(255,255,255,0.045); --border: rgba(255,255,255,0.14);
}
*, *::before, *::after { box-sizing: border-box; }
html, body {
    width: 100%; max-width: 100%; overflow-x: hidden;
    background-color: var(--bg) !important; color: var(--text) !important;
}
.katex-display {
    display: block !important; max-width: 100% !important;
    overflow-x: auto !important; overflow-y: hidden !important;
    -webkit-overflow-scrolling: touch !important; padding: 0.5rem 0.2rem !important;
}
blockquote {
    background: var(--quote) !important; color: var(--muted) !important;
    border-left: 3px solid var(--border) !important; max-width: 100% !important; overflow-x: auto !important;
}
</style>
